name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ""
          coverage: none

      - run: composer update --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  # The only job that ever resolves the dev toolchain downwards. Nothing else
  # does: everywhere else takes the newest release, so a require-dev constraint
  # wide enough to admit a version that cannot run this package's own config is
  # never exercised. That is not hypothetical here - phpstan.neon sets
  # phpVersion.max to 80500, which PHPStan rejected before 2.1.22, and the
  # constraint said ^2.0.
  #
  # Pint is deliberately not run here. Its rule set moves between patches, so
  # the oldest Pint rejects code the newest accepts - churn, not a defect.
  lowest:
    name: PHP 8.3, lowest dependencies
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none

      - run: composer update --prefer-lowest --prefer-dist --no-progress

      - run: vendor/bin/phpunit

      - run: vendor/bin/phpstan analyse --no-progress

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none

      # bin/rig must stay executable: README and CLAUDE.md both document running
      # ./bin/rig from a clone. A commit made through a client that cannot see
      # the Linux permission bit silently clears it, and nothing notices until
      # someone tries to run it. Checked against the index rather than the
      # working tree, because the index is what a fresh clone gets.
      - name: bin/rig is executable
        run: |
          if ! git ls-files -s bin/rig | grep -q '^100755'; then
            echo 'bin/rig has lost its executable bit.'
            echo 'Restore it with: git update-index --chmod=+x bin/rig'
            exit 1
          fi

      - run: composer validate --strict

      - run: composer update --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      # Runs once rather than per version: phpstan.neon analyses the whole
      # 8.3 - 8.5 range in a single pass, whatever PHP it runs on.
      - run: vendor/bin/phpstan analyse --no-progress
