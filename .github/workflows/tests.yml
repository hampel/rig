name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Every version the "php" constraint in composer.json claims. Keep the
        # two in step: an untested version here is an unbacked promise there.
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ""
          coverage: none

      # No --prefer-lowest corner here, which is a decision rather than an
      # oversight. That job exists to catch a package using an API added in a
      # later patch of a dependency than its own constraint claims; this package
      # requires php and nothing else, so there is nothing to resolve downwards.
      # Add the corner the day that stops being true.
      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/phpunit

  analyse:
    name: Static analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: ""
          coverage: none

      # bin/rig must stay executable: README and CLAUDE.md both document running
      # ./bin/rig from a clone. A commit made through a client that cannot see
      # the Linux permission bit silently clears it, and nothing notices until
      # someone tries to run it. Checked against the index rather than the
      # working tree, because the index is what a fresh clone gets.
      - name: bin/rig is executable
        run: |
          if ! git ls-files -s bin/rig | grep -q '^100755'; then
            echo 'bin/rig has lost its executable bit.'
            echo 'Restore it with: git update-index --chmod=+x bin/rig'
            exit 1
          fi

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test

      # Runs once rather than per version: phpstan.neon analyses the whole
      # 8.3 - 8.5 range in a single pass, whatever PHP it runs on.
      - run: vendor/bin/phpstan analyse --no-progress
